      - "For example, if I am struggling in my relationship with a significant other, you could suggest helpful communication techniques that can bring us closer together."
      - "My first request is \"I need help staying motivated during difficult times\"—as the guiding objective, while inferring any missing details sensibly from common scenarios in this domain."
  context:
    base:
      - "Draw on relevant background knowledge the user might expect (e.g., prior examples, local notes, or public references) to ground the response, but keep explanations compact and practical."
      - "Shape the result so it feels ready-to-use: organize ideas cleanly in Markdown with readable sections, short paragraphs, and bullet points where that improves clarity; include brief examples or snippets when they help the user act immediately."
      - "Maintain a professional, helpful tone; avoid unsafe, private, or unverifiable claims; and finish with a lightweight next step or prompt the user could follow to continue."
  output:
    base:
      - "Provide structured, actionable self-help advice in clear Markdown sections."
      - "Offer realistic, compassionate steps grounded in emotional intelligence."
      - "Include small examples or exercises that help the user apply the advice immediately."
      - "End with a motivating or reflective next step."
  query: "I need help staying motivated during difficult times"
