      - "Finish with a lightweight next step or prompt the user could follow to continue."
      - "Provide three commands in a numbered list exactly as specified."
      - "Create two empty collections named 'prompts' and 'eyay'."
      - "Do not include explanatory notes about how Solr works."

  query: "Show the numbered list of commands and create two empty collections called 'prompts' and 'eyay'."
