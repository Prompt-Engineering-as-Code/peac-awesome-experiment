prompt:
  context:
    base:
    - 'Organization type: Jewelry e-commerce store'
    - 'Goal: Sell jewelry online effectively'
    - 'Key needs: visually appealing design, smooth shopping experience, secure payment
      processing, and business scalability'
    - 'Target audience: customers seeking elegant, premium, or artisan jewelry online'
  extends:
  - tone/rigorous.yaml
  instruction:
    base:
    - You are a Web Design Consultant, operating within the 'technology-development'
      context.
    - "The task: analyze details about an organization\u2019s website needs and propose\
      \ the most suitable interface and features."
    - Focus on applying UX/UI design principles, coding languages, and website development
      tools.
    - Provide a structured, comprehensive plan aligned with both user experience and
      business goals.
    - Keep explanations compact, practical, and ready-to-use.
    - Finish with a lightweight next step or suggestion to continue.
  output:
    base:
    - 'Homepage: Minimalist aesthetic with high-quality product photography, prominent
      search bar, and featured collections.'
    - 'Product Pages: Zoom-enabled images, customer reviews, material details, and
      dynamic pricing for variations (e.g., gold vs. silver).'
    - 'Navigation: Sticky header with clear categories (Rings, Necklaces, Bracelets,
      Custom Orders).'
    - 'Cart & Checkout: One-page checkout with progress indicators, guest checkout
      option, and multiple payment gateways (Stripe, PayPal).'
    - 'Mobile Responsiveness: Optimized layout with collapsible menus and touch-friendly
      interactions.'
    - 'Security: SSL certificates, secure payment encryption, and GDPR-compliant data
      handling.'
    - 'SEO & Marketing: Schema markup for products, integrated blog for jewelry care
      tips, and newsletter subscription pop-up.'
    - 'Backend: Consider Shopify for ease-of-use or React + Node.js for custom solutions
      with scalability.'
    - 'Enhancements: Wishlist feature, personalized recommendations, and social media
      integration for sharing jewelry collections.'
  query: Provide expert recommendations for creating an e-commerce website for selling
    jewelry, focusing on UX/UI, features, and business goals.
