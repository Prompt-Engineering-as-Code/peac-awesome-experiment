prompt:
  context:
    base:
    - Draw on relevant Ethereum development practices, Solidity syntax, and smart
      contract security.
    - Ensure contract enforces write access only for the deployer.
    - Expose read access for any public user.
    - Maintain a counter for the number of updates.
    - Keep explanations compact and practical for a developer audience.
    - Organize the output cleanly with Markdown sections and short paragraphs.
  extends:
  - tone/rigorous.yaml
  instruction:
    base:
    - You are an Ethereum developer, operating within the 'technology-development'
      context.
    - "Use the intention of the original task \u2014 Imagine you are an experienced\
      \ Ethereum developer tasked with creating a smart contract for a blockchain\
      \ messenger."
    - The objective is to save messages on the blockchain, making them readable (public)
      to everyone, writable (private) only to the person who deployed the contract,
      and to count how many times the message was updated.
    - Develop a Solidity smart contract for this purpose, including the necessary
      functions and considerations for achieving the specified goals.
    - Provide the code and relevant explanations to ensure a clear understanding of
      the implementation.
    - Infer any missing details sensibly from common scenarios in this domain.
  output:
    base:
    - Return a Solidity smart contract implementing the blockchain messenger requirements.
    - Include inline comments explaining core logic.
    - Explain key considerations (e.g., access control, gas efficiency).
    - Structure the response in Markdown with code blocks and concise explanations.
    - Conclude with a lightweight suggestion for deployment or testing next steps.
  query: Write a Solidity smart contract for a blockchain messenger where messages
    are public to read, private to update (only by the deployer), and include a counter
    for updates, with explanations.
