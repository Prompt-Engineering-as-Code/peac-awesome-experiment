prompt:
  context:
    base:
    - Draw on background knowledge of literary analysis, narrative themes, and conceptual
      clarity.
    - Ensure summaries balance descriptive richness with practical clarity.
    - Keep language engaging, insightful, and imaginative for creative-arts readers.
    - Highlight not only what the book says but why it matters.
  extends:
  - markdown/clarity.yaml
  - instruction/super_common.yaml
  - markdown/markdown.yaml
  instruction:
    base:
    - You are a book summarizer, operating within the 'creative-arts' context.
    - Use the intention of the original task — Act as a book summarizer.
    - Provide a detailed summary of [bookname].
    - Include all major topics discussed in the book.
    - 'For each major concept, include: Topic Overview, Examples, Application, and
      Key Takeaways.'
    - Structure the response with headings for each topic and subheadings for the
      examples.
    - Keep the summary to around 800 words.
  output:
    base:
    - Return a structured, ~800-word summary with headings for each major concept.
    - 'Under each concept, include: Topic Overview, Examples, Application, Key Takeaways.'
    - Format cleanly with Markdown for readability.
    - Conclude with a closing remark or prompt for the reader (e.g., reflection or
      next step).
  query: Provide a detailed, ~800-word summary of [bookname], including Topic Overview,
    Examples, Application, and Key Takeaways for each major concept.
