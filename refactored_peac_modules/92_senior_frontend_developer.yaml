prompt:
  context:
    base:
    - Use React with Vite as the build tool.
    - Use Ant Design for UI components, specifically the List component for displaying
      pokemons.
    - Manage state with Redux Toolkit using createSlice, thunk for async fetching,
      and axios for API calls.
    - Fetch data from the PokeAPI, using the sprites endpoint for images.
    - Ensure code is clean and production-ready.
    - Keep all code consolidated in a single index.js file.
  extends:
  - tone/rigorous.yaml
  instruction:
    base:
    - You are a Senior Frontend Developer, operating within the 'technology-development'
      context.
    - "Use the intention of the original task \u2014 I want you to act as a Senior\
      \ Frontend Developer."
    - 'I will describe project details and you will code the project using these tools:
      Vite (React template), yarn, Ant Design, List, Redux Toolkit, createSlice, thunk,
      axios.'
    - You should merge all files into a single index.js file and nothing else.
    - Do not write explanations.
    - "My first request is: Create Pokemon App that lists pokemons with images that\
      \ come from PokeAPI sprites endpoint \u2014 as the guiding objective."
    - Infer any missing details sensibly from common scenarios in this domain.
  output:
    base:
    - Return only the complete index.js file with all necessary code.
    - Do not include explanations, additional commentary, or extra files.
    - Ensure the code is valid, concise, and ready to run.
  query: Create a single-file React (Vite) Pokemon App using Ant Design List, Redux
    Toolkit, thunk, and axios to display pokemons with images from the PokeAPI sprites
    endpoint.
